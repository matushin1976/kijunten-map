<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GNSS点グルーピング</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI",sans-serif;color:#1f2937;background:#f3f4f6}
body{margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0001}h1{font-size:24px;margin:0 0 16px}h2{font-size:18px;margin:0 0 12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{font-size:13px;font-weight:700;display:block;margin-bottom:4px}input,select,button{font:inherit}input[type=text],input[type=number],select{padding:9px;border:1px solid #cbd5e1;border-radius:7px;min-width:120px}button{border:0;border-radius:8px;padding:9px 14px;background:#2563eb;color:white;cursor:pointer}button.gray{background:#64748b}button.red{background:#dc2626}button.small{padding:5px 9px;font-size:13px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left;font-size:14px}th{background:#f8fafc}.muted{color:#64748b;font-size:13px}.group{border:1px solid #dbeafe;border-radius:10px;margin:10px 0;overflow:hidden}.group-head{background:#eff6ff;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.group-body{padding:4px 12px 10px}.badge{display:inline-block;background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:999px;font-size:12px}.ok{color:#166534}.warn{color:#b45309}.error{color:#b91c1c;white-space:pre-wrap}.hide{display:none}@media(max-width:700px){.wrap{padding:10px}th:nth-child(4),td:nth-child(4){display:none}}
</style>
</head>
<body><div class="wrap">
<h1>GNSS点グルーピング</h1>
<div class="card">
<h2>1. 基準点・既知点の入力</h2>
<div class="row">
<div><label>区分</label><select id="kpType"><option>基準点</option><option>既知点</option></select></div>
<div><label>点名</label><input id="kpName" type="text"></div>
<div><label>X</label><input id="kpX" type="number" step="0.001"></div>
<div><label>Y</label><input id="kpY" type="number" step="0.001"></div>
<div><label>標高</label><input id="kpH" type="number" step="0.001"></div>
<div><button id="addKp">追加</button></div>
</div>
<table><thead><tr><th>区分</th><th>点名</th><th>X</th><th>Y</th><th>標高</th><th></th></tr></thead><tbody id="kpBody"></tbody></table>
<p class="muted">入力内容はこのブラウザ内に保存されます。</p>
</div>
<div class="card">
<h2>2. GPX読込みとグルーピング</h2>
<div class="row">
<div><label>GPXファイル</label><input id="gpxFile" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml"></div>
<div><label>同一点とみなす距離</label><input id="threshold" type="number" value="0.10" min="0.001" step="0.01" style="width:90px"> m</div>
<div><button id="loadBtn">読込み</button></div>
</div>
<p id="status" class="muted">GPXを選択して「読込み」を押してください。</p>
<div id="groups"></div>
</div>
<div class="card">
<h2>操作</h2>
<p class="muted">サーバー不要です。このHTMLを直接ダブルクリックして使えます。GPXの点名が違っても、座標が設定距離以内なら同じグループにまとめます。</p>
</div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
let knownPoints=JSON.parse(localStorage.getItem('gnss_known_points')||'[]');
let observations=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderKnown(){const b=$('kpBody');b.innerHTML='';knownPoints.forEach((p,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(p.type)}</td><td>${esc(p.name)}</td><td>${esc(p.x)}</td><td>${esc(p.y)}</td><td>${esc(p.h)}</td><td><button class="red small" data-del="${i}">削除</button></td>`;b.appendChild(tr)});localStorage.setItem('gnss_known_points',JSON.stringify(knownPoints));}
$('addKp').onclick=()=>{const name=$('kpName').value.trim();if(!name){alert('点名を入力してください');return;}knownPoints.push({type:$('kpType').value,name,x:$('kpX').value,y:$('kpY').value,h:$('kpH').value});['kpName','kpX','kpY','kpH'].forEach(id=>$(id).value='');renderKnown();};
$('kpBody').onclick=e=>{const i=e.target.dataset.del;if(i!==undefined){knownPoints.splice(Number(i),1);renderKnown();}};
function nodeText(el,names){for(const name of names){const all=el.getElementsByTagName('*');for(const n of all){if((n.localName||n.nodeName).toLowerCase()===name.toLowerCase())return (n.textContent||'').trim();}}return ''}
function parseGpx(xmlText){const doc=new DOMParser().parseFromString(xmlText,'application/xml');const err=doc.querySelector('parsererror');if(err)throw new Error('GPXのXMLを解析できません。\n'+err.textContent.slice(0,250));let nodes=[...doc.getElementsByTagNameNS('*','wpt')];if(!nodes.length)nodes=[...doc.getElementsByTagName('wpt')];if(!nodes.length)throw new Error('waypoint（wpt）が見つかりません。');return nodes.map((w,i)=>({id:i+1,name:nodeText(w,['name'])||`点${i+1}`,lat:Number(w.getAttribute('lat')),lon:Number(w.getAttribute('lon')),ele:nodeText(w,['ele']),time:nodeText(w,['time']),sat:nodeText(w,['sat']),hdop:nodeText(w,['hdop'])})).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon));}
function distance(a,b){const R=6378137,rad=Math.PI/180;const p1=a.lat*rad,p2=b.lat*rad,dp=(b.lat-a.lat)*rad,dl=(b.lon-a.lon)*rad;const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function groupPoints(points,t){const groups=[];for(const p of points){let best=-1,bestD=Infinity;groups.forEach((g,i)=>{const d=Math.min(...g.points.map(q=>distance(p,q)));if(d<=t&&d<bestD){best=i;bestD=d}});if(best<0)groups.push({name:p.name,points:[p]});else groups[best].points.push(p);}return groups;}
function fmtTime(s){if(!s)return '';try{return new Date(s).toLocaleString('ja-JP',{hour12:false})}catch{return s}}
function renderGroups(){const t=Number($('threshold').value)||0.10;const gs=groupPoints(observations,t);const root=$('groups');root.innerHTML='';if(!gs.length)return;gs.forEach((g,gi)=>{const names=[...new Set(g.points.map(p=>p.name))];const div=document.createElement('div');div.className='group';div.innerHTML=`<div class="group-head"><div><strong>グループ ${gi+1}</strong> <span class="badge">${g.points.length}観測</span><br><span class="muted">点名: ${esc(names.join(' / '))}</span></div><div><label style="display:inline">報告書用点名 </label><input type="text" value="${esc(names[0])}" style="width:120px"></div></div><div class="group-body"><table><thead><tr><th>No.</th><th>点名</th><th>観測時刻</th><th>緯度</th><th>経度</th><th>標高</th><th>衛星</th><th>HDOP</th></tr></thead><tbody>${g.points.map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${esc(fmtTime(p.time))}</td><td>${p.lat.toFixed(9)}</td><td>${p.lon.toFixed(9)}</td><td>${esc(p.ele)}</td><td>${esc(p.sat)}</td><td>${esc(p.hdop)}</td></tr>`).join('')}</tbody></table></div>`;root.appendChild(div)});$('status').textContent=`${observations.length}観測を読み込み、${gs.length}グループにまとめました（判定距離 ${t.toFixed(3)}m）。`;}
$('loadBtn').onclick=async()=>{const f=$('gpxFile').files[0];if(!f){alert('GPXファイルを選択してください');return;}try{$('status').textContent='読込み中…';observations=parseGpx(await f.text());renderGroups();}catch(e){$('status').className='error';$('status').textContent=e.message;}};
$('threshold').onchange=()=>{if(observations.length)renderGroups();};
renderKnown();
</script>
</body></html>
