<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>基準点マップ v50</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: sans-serif; margin: 10px; }
.item { border-bottom: 1px solid #ccc; padding: 8px; }
.dist { font-size: 18px; font-weight: bold; }
.badge {
  display:inline-block;
  padding:3px 6px;
  border-radius:4px;
  color:#fff;
  font-size:12px;
  margin-right:5px;
}
</style>
</head>
<body>

<h3>基準点（5km以内 / 最大50件）</h3>
<button onclick="loadData()">現在地で検索</button>

<div id="status">待機中</div>
<div id="list"></div>

<script>
const MAX_POINTS = 50;
const MAX_DIST = 5000;

// 等級カラー
function getColor(grade){
  if(!grade) return "#999";
  if(grade.includes("一等")) return "#ff0000";
  if(grade.includes("二等")) return "#ff6600";
  if(grade.includes("三等")) return "#ffaa00";
  if(grade.includes("四等")) return "#0066ff";
  return "#999";
}

// 度分秒 → 小数
function dmsToDeg(v){
  if(!v) return null;
  let s = v.toString();
  if(s.length < 6) return parseFloat(v);
  let deg = parseFloat(s.slice(0,2));
  let min = parseFloat(s.slice(2,4));
  let sec = parseFloat(s.slice(4));
  return deg + min/60 + sec/3600;
}

// 距離
function dist(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
    Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function loadData(){
  document.getElementById("status").innerText="位置取得中...";
  navigator.geolocation.getCurrentPosition(async pos=>{
    const myLat = pos.coords.latitude;
    const myLon = pos.coords.longitude;

    document.getElementById("status").innerText="読み込み中...";

    const res = await fetch("kijunten.geojson");
    const geo = await res.json();

    let arr = [];

    geo.features.forEach(f=>{
      const p = f.properties;

      let lat = f.geometry.coordinates[1];
      let lon = f.geometry.coordinates[0];

      if(!lat || !lon){
        lat = dmsToDeg(p["北緯"]);
        lon = dmsToDeg(p["東経"]);
      }

      if(!lat || !lon) return;

      const d = dist(myLat, myLon, lat, lon);

      if(d <= MAX_DIST){
        arr.push({
          name: p["基準点名"],
          grade: p["等級種別"],
          status: p["現況状態"],
          d: d,
          lat: lat,
          lon: lon
        });
      }
    });

    arr.sort((a,b)=>a.d-b.d);

    arr = arr.slice(0, MAX_POINTS);

    document.getElementById("status").innerText =
      `該当 ${arr.length}件`;

    let html="";
    arr.forEach(a=>{
      html += `
      <div class="item">
        <span class="badge" style="background:${getColor(a.grade)}">
          ${a.grade}
        </span>
        <div>${a.name}</div>
        <div class="dist">${a.d.toFixed(0)} m</div>
        <a href="https://www.google.com/maps?q=${a.lat},${a.lon}" target="_blank">
          地図
        </a>
      </div>
      `;
    });

    document.getElementById("list").innerHTML = html;

  }, err=>{
    document.getElementById("status").innerText="位置取得失敗";
  });
}
</script>

</body>
</html>
