<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>基準点 近傍検索</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#111; --muted:#666; --line:#ddd; --accent:#0b66c3; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    header { position:sticky; top:0; z-index:10; background:var(--card); border-bottom:1px solid var(--line); padding:12px; }
    h1 { font-size:18px; margin:0 0 8px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
    button, select, input { font-size:16px; padding:9px 10px; border:1px solid #ccc; border-radius:10px; background:#fff; }
    button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
    label { font-size:14px; color:var(--muted); display:flex; align-items:center; gap:4px; }
    main { padding:12px; }
    .status { font-size:13px; color:var(--muted); margin-top:6px; line-height:1.45; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin:10px 0; box-shadow:0 1px 3px rgba(0,0,0,.04); }
    .title { font-size:17px; font-weight:700; margin-bottom:6px; }
    .badges { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
    .badge { background:#eef3f8; color:#234; padding:3px 7px; border-radius:999px; font-size:12px; }
    .dist { font-weight:700; color:#0a5; }
    .meta { color:var(--muted); font-size:13px; line-height:1.5; }
    .links { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
    a.btn { text-decoration:none; color:#fff; background:#333; border-radius:10px; padding:8px 10px; font-size:14px; }
    a.btn.blue { background:var(--accent); }
    .empty { text-align:center; color:var(--muted); padding:30px 10px; }
  </style>
</head>
<body>
<header>
  <h1>基準点 近傍検索</h1>
  <div class="row">
    <button id="locBtn" class="primary">現在地から検索</button>
    <select id="radius">
      <option value="1">1km以内</option>
      <option value="3">3km以内</option>
      <option value="5" selected>5km以内</option>
      <option value="10">10km以内</option>
      <option value="20">20km以内</option>
      <option value="9999">全件</option>
    </select>
    <select id="grade"><option value="">等級すべて</option></select>
  </div>
  <div class="row">
    <input id="q" type="search" placeholder="点名・コード・自治体で検索" style="flex:1; min-width:220px;" />
    <label><input id="normalOnly" type="checkbox" checked /> 正常のみ</label>
  </div>
  <div id="status" class="status">CSVを読み込み中…</div>
</header>
<main id="list"></main>
<script>
const CSV_URL = 'kijunten.csv';
const MAX_SHOW = 200;
let points = [];
let current = null;

const $ = id => document.getElementById(id);

function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', inQ = false;
  for (let i=0;i<text.length;i++) {
    const c = text[i], n = text[i+1];
    if (inQ) {
      if (c === '"' && n === '"') { cell += '"'; i++; }
      else if (c === '"') inQ = false;
      else cell += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(cell); cell=''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row=[]; cell=''; }
      else if (c !== '\r') cell += c;
    }
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function dmsToDeg(v) {
  if (v == null) return NaN;
  const s = String(v).trim();
  if (!s) return NaN;
  const num = parseFloat(s);
  if (!Number.isFinite(num)) return NaN;
  // GSI style: latitude 323338.3297 = 32°33′38.3297″, longitude 1312747.5465 = 131°27′47.5465″
  const dot = s.indexOf('.');
  const intPart = (dot >= 0 ? s.slice(0, dot) : s).replace(/[^0-9-]/g,'');
  const neg = intPart.startsWith('-');
  const raw = neg ? intPart.slice(1) : intPart;
  if (raw.length < 5) return num; // already decimal-ish
  const sec = parseFloat(raw.slice(-2) + (dot >= 0 ? s.slice(dot) : ''));
  const min = parseInt(raw.slice(-4, -2), 10);
  const deg = parseInt(raw.slice(0, -4), 10);
  const out = deg + min/60 + sec/3600;
  return neg ? -out : out;
}

function haversineKm(aLat, aLon, bLat, bLon) {
  const R = 6371.0088;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(bLat-aLat), dLon = toRad(bLon-aLon);
  const s1 = Math.sin(dLat/2), s2 = Math.sin(dLon/2);
  const h = s1*s1 + Math.cos(toRad(aLat))*Math.cos(toRad(bLat))*s2*s2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function fmtDist(km) {
  if (!Number.isFinite(km)) return '距離未計算';
  if (km < 1) return Math.round(km*1000) + ' m';
  return km.toFixed(km < 10 ? 2 : 1) + ' km';
}

async function loadCSV() {
  const res = await fetch(CSV_URL, {cache:'no-store'});
  const buf = await res.arrayBuffer();
  let text;
  try { text = new TextDecoder('shift_jis').decode(buf); }
  catch(e) { text = new TextDecoder('utf-8').decode(buf); }
  if (!text.includes('基準点コード')) text = new TextDecoder('utf-8').decode(buf);

  const rows = parseCSV(text).filter(r => r.some(c => String(c).trim() !== ''));
  const header = rows.shift().map(h => h.trim());
  const idx = name => header.indexOf(name);
  const need = ['基準点コード','等級種別','基準点名','北緯','東経','現況状態'];
  const missing = need.filter(n => idx(n) < 0);
  if (missing.length) throw new Error('CSVに必要列がありません: ' + missing.join(', '));

  points = rows.map(r => {
    const get = n => (r[idx(n)] || '').trim();
    const lat = dmsToDeg(get('北緯'));
    const lon = dmsToDeg(get('東経'));
    return {
      code:get('基準点コード'), grade:get('等級種別'), name:get('基準点名'),
      lat, lon, latRaw:get('北緯'), lonRaw:get('東経'),
      elev:get('標高'), status:get('現況状態'), date:get('現況年月日'),
      pref:get('都道府県名'), city:get('自治体名'), system:get('平面直角座標系'), x:get('X'), y:get('Y')
    };
  }).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));

  const grades = [...new Set(points.map(p=>p.grade).filter(Boolean))].sort();
  for (const g of grades) {
    const o = document.createElement('option'); o.value = g; o.textContent = g;
    $('grade').appendChild(o);
  }
  $('status').textContent = `${points.length}点を読み込み。現在地を押すと5km以内を近い順に表示します。`;
  render();
}

function getFiltered() {
  const rad = parseFloat($('radius').value);
  const grade = $('grade').value;
  const q = $('q').value.trim().toLowerCase();
  const normalOnly = $('normalOnly').checked;
  let arr = points.map(p => ({...p}));
  if (current) {
    arr.forEach(p => p.dist = haversineKm(current.lat, current.lon, p.lat, p.lon));
    arr = arr.filter(p => rad >= 9999 || p.dist <= rad);
    arr.sort((a,b) => a.dist - b.dist);
  } else {
    arr.sort((a,b) => (a.city+a.name).localeCompare(b.city+b.name, 'ja'));
  }
  if (grade) arr = arr.filter(p => p.grade === grade);
  if (normalOnly) arr = arr.filter(p => p.status === '正常');
  if (q) arr = arr.filter(p => [p.code,p.grade,p.name,p.status,p.pref,p.city].join(' ').toLowerCase().includes(q));
  return arr;
}

function render() {
  const list = $('list');
  const arr = getFiltered();
  const shown = arr.slice(0, MAX_SHOW);
  const radText = $('radius').selectedOptions[0].textContent;
  $('status').textContent = `${points.length}点中 ${arr.length}点該当。${shown.length}点表示。${current ? '現在地基準・' + radText : '現在地未取得'}`;
  if (!shown.length) { list.innerHTML = '<div class="empty">該当する基準点がありません。</div>'; return; }
  list.innerHTML = shown.map(p => {
    const gmap = `https://www.google.com/maps?q=${p.lat},${p.lon}`;
    const nav = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;
    return `<section class="card">
      <div class="title">${esc(p.name || '(点名なし)')} ${current ? `<span class="dist">${fmtDist(p.dist)}</span>` : ''}</div>
      <div class="badges">
        <span class="badge">${esc(p.grade)}</span><span class="badge">${esc(p.status)}</span><span class="badge">${esc(p.city)}</span>
      </div>
      <div class="meta">
        コード：${esc(p.code)}<br>
        緯度経度：${p.lat.toFixed(8)}, ${p.lon.toFixed(8)}（元: ${esc(p.latRaw)}, ${esc(p.lonRaw)}）<br>
        標高：${esc(p.elev)} m　平面直角：${esc(p.system)}系 X=${esc(p.x)} Y=${esc(p.y)}<br>
        現況年月日：${esc(p.date)}
      </div>
      <div class="links"><a class="btn blue" href="${gmap}" target="_blank">Googleマップ</a><a class="btn" href="${nav}" target="_blank">経路</a></div>
    </section>`;
  }).join('');
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

$('locBtn').addEventListener('click', () => {
  if (!navigator.geolocation) { alert('この端末では位置情報が使えません。'); return; }
  $('status').textContent = '現在地を取得中…';
  navigator.geolocation.getCurrentPosition(pos => {
    current = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    render();
  }, err => {
    $('status').textContent = '現在地取得に失敗しました: ' + err.message;
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:10000 });
});
['radius','grade','q','normalOnly'].forEach(id => $(id).addEventListener('input', render));
loadCSV().catch(e => { $('status').textContent = '読み込みエラー: ' + e.message; console.error(e); });
</script>
</body>
</html>
