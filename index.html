<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宮崎県 基準点マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.2.0/encoding.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#111}
header{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #ccc;padding:9px}
h1{font-size:17px;margin:0}.ver{font-size:11px;color:#666;margin-top:2px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
button,select,input{font-size:14px;min-width:0;padding:8px;border:1px solid #bbb;border-radius:8px;background:#fff}.full{grid-column:1/-1}
button{border:none;background:#1769aa;color:#fff;font-weight:700}.secondary{background:#444}.light{background:#777}
label.check{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 2px}label.check input{width:auto}
#map{height:48vh;min-height:310px;background:#ddd}.status{padding:7px 10px;font-size:12px;background:#fff;border-bottom:1px solid #ddd}
.legend{display:flex;flex-wrap:wrap;gap:5px;padding:7px 9px;background:#fff;border-bottom:1px solid #ddd;font-size:11px}.legend span{display:flex;align-items:center;gap:3px}.dot{width:12px;height:12px;border-radius:50%;border:1px solid #222;display:inline-block}
#list{padding:7px}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:9px;margin:7px 0}.row{display:flex;gap:8px}.row>input{margin-top:3px}.title{font-weight:700}.pill{display:inline-block;border-radius:999px;padding:2px 7px;margin:4px 4px 0 0;font-size:11px;border:1px solid #0003}.meta{font-size:12px;line-height:1.55;color:#333;margin-top:5px}.links a{display:inline-block;margin:6px 10px 0 0;font-size:12px;font-weight:700;color:#1769aa;text-decoration:none}.dead{color:#b00020;font-weight:700}
</style>
</head>
<body>
<header>
<h1>宮崎県 基準点マップ</h1><div class="ver">元CSV再構築版 2026-08-02</div>
<div class="controls">
<label class="check full"><input type="checkbox" id="useLocation"> 現在地を基準に半径で絞り込む</label>
<select id="radius"><option value="1">現在地から1km</option><option value="3">現在地から3km</option><option value="5" selected>現在地から5km</option><option value="10">現在地から10km</option><option value="20">現在地から20km</option><option value="50">現在地から50km</option></select>
<button id="locBtn">現在地を取得</button>
<select id="group"><option value="">基準点・節点等すべて</option><option value="基準点">基準点のみ</option><option value="節点・補助点">節点・補助点のみ</option></select>
<select id="type"><option value="">種類すべて</option></select>
<select id="status"><option value="正常" selected>正常点のみ</option><option value="">正常・廃点すべて</option><option value="廃点">廃点のみ</option></select>
<select id="max"><option value="100">最大100点</option><option value="300" selected>最大300点</option><option value="1000">最大1000点</option><option value="99999">上限なし</option></select>
<input id="q" class="full" placeholder="点名・コード・所在地・市区町村で検索">
<button id="selectShown" class="secondary">表示分を選択</button><button id="clearSel" class="light">選択解除</button>
<button id="dlSima" class="full">選択点をSIMAで保存</button>
</div>
</header>
<div id="map"></div>
<div class="legend" id="legend"></div>
<div class="status" id="statusText">読込中...</div>
<div id="list"></div>
<script>
const COLORS={
 '街区三角点':'#e53935','街区多角点':'#1976d2','都市官三角点':'#8e24aa','都市官多角点':'#00897b',
 '街区三角点節点':'#fb8c00','街区多角点節点':'#fdd835','街区点補助点':'#7cb342'
};
const ORDER=['街区三角点','街区多角点','都市官三角点','都市官多角点','街区三角点節点','街区多角点節点','街区点補助点'];
const $=id=>document.getElementById(id); const map=L.map('map').setView([32.58,131.66],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const markerLayer=L.layerGroup().addTo(map); let data=[],shown=[],currentPos=null,selected=new Set(),locationMarker=null;
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));}
function hav(a,b,c,d){const R=6371000,r=Math.PI/180,da=(c-a)*r,db=(d-b)*r;const x=Math.sin(da/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(db/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function inView(f){const [lon,lat]=f.geometry.coordinates;return map.getBounds().contains([lat,lon]);}
function buildControls(){const types=[...new Set(data.map(f=>f.properties['種類']))].sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));$('type').innerHTML='<option value="">種類すべて</option>'+types.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('legend').innerHTML=types.map(x=>`<span><i class="dot" style="background:${COLORS[x]||'#777'}"></i>${esc(x)}</span>`).join('');}
function render(){
 const useLoc=$('useLocation').checked, radius=Number($('radius').value)*1000, group=$('group').value,type=$('type').value,status=$('status').value,q=$('q').value.trim().toLowerCase(),max=Number($('max').value);
 let arr=data.map((f,i)=>({f,i,dist:currentPos?hav(currentPos.lat,currentPos.lon,f.geometry.coordinates[1],f.geometry.coordinates[0]):null}));
 arr=arr.filter(o=>{const p=o.f.properties;if(useLoc){if(!currentPos||o.dist>radius)return false}else if(!inView(o.f))return false;if(group&&p['分類']!==group)return false;if(type&&p['種類']!==type)return false;if(status&&p['状態']!==status)return false;const txt=[p['名称'],p['基準点コード'],p['所在地'],p['市区町村'],p['種類']].join(' ').toLowerCase();return !q||txt.includes(q);});
 arr.sort((a,b)=>useLoc?(a.dist-b.dist):((a.f.properties['種類']||'').localeCompare(b.f.properties['種類']||'')));
 const total=arr.length;shown=arr.slice(0,max);drawMap();drawList();$('statusText').textContent=`全${data.length.toLocaleString()}点中 ${total.toLocaleString()}点該当 / 表示${shown.length.toLocaleString()}点 / ${useLoc?'現在地基準':'地図表示範囲基準'}`;
}
function drawMap(){markerLayer.clearLayers();if(currentPos){locationMarker=L.circleMarker([currentPos.lat,currentPos.lon],{radius:8,color:'#000',fillColor:'#fff',fillOpacity:1,weight:3}).bindPopup('現在地').addTo(markerLayer);}shown.forEach(o=>{const p=o.f.properties,[lon,lat]=o.f.geometry.coordinates,c=COLORS[p['種類']]||'#777';const html=`<b>${esc(p['名称']||'名称なし')}</b><br>${esc(p['種類'])} ${p['状態']==='廃点'?'<span class="dead">廃点</span>':''}<br>X：${Number(p.X).toFixed(3)} m<br>Y：${Number(p.Y).toFixed(3)} m<br>標高：${p['標高']==null?'-':Number(p['標高']).toFixed(3)+' m'}<br>${esc(p['所在地']||'')}`;L.circleMarker([lat,lon],{radius:7,color:'#222',weight:1,fillColor:c,fillOpacity:p['状態']==='廃点'?0.35:0.9}).bindPopup(html).addTo(markerLayer);});}
function drawList(){if(!shown.length){$('list').innerHTML='<div class="card">この条件・表示範囲に点がありません。</div>';return;}$('list').innerHTML=shown.map(o=>{const p=o.f.properties,[lon,lat]=o.f.geometry.coordinates;return `<div class="card"><div class="row"><input type="checkbox" data-id="${o.i}" ${selected.has(o.i)?'checked':''}><div><div class="title">${esc(p['名称']||'名称なし')}</div><span class="pill" style="background:${COLORS[p['種類']]||'#ddd'};color:${p['種類']==='街区多角点節点'?'#111':'#fff'}">${esc(p['種類'])}</span><span class="pill">${esc(p['分類'])}</span>${p['状態']==='廃点'?'<span class="pill dead">廃点</span>':''}<div class="meta">コード：${esc(p['基準点コード']||'-')}<br>X：${Number(p.X).toFixed(3)} m / Y：${Number(p.Y).toFixed(3)} m / 標高：${p['標高']==null?'-':Number(p['標高']).toFixed(3)+' m'}<br>${esc(p['所在地']||'-')}<br>${esc(p['市区町村']||'')} / ${esc(p['データ由来']||'')}</div><div class="links"><a target="_blank" href="https://maps.google.com/?q=${lat},${lon}">Googleマップ</a><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}">経路</a></div></div></div></div>`}).join('');document.querySelectorAll('#list input[type=checkbox]').forEach(x=>x.onchange=e=>{const id=Number(e.target.dataset.id);e.target.checked?selected.add(id):selected.delete(id);});}
function getLocation(){if(!navigator.geolocation){alert('位置情報に非対応です');return;}navigator.geolocation.getCurrentPosition(pos=>{currentPos={lat:pos.coords.latitude,lon:pos.coords.longitude};map.setView([currentPos.lat,currentPos.lon],14);$('useLocation').checked=true;render();},e=>alert('現在地を取得できません：'+e.message),{enableHighAccuracy:true,timeout:12000,maximumAge:30000});}
function downloadSima(){const rows=[...selected].map(i=>data[i]).filter(Boolean);if(!rows.length){alert('点を選択してください');return;}const lines=['G00,04,基準点選択,','Z00,座標データ,','A00,'];rows.forEach((f,i)=>{const p=f.properties,n=String(p['名称']||'点'+(i+1)).replace(/,/g,' '),z=p['標高']==null?0:p['標高'];lines.push(`A01,${i+1},${n},${Number(p.X).toFixed(4)},${Number(p.Y).toFixed(4)},${Number(z).toFixed(4)},,`);});lines.push('A99,','Z99,','G99,');const s=lines.join('\r\n')+'\r\n';if(!window.Encoding){alert('文字コード変換ライブラリを読み込めません');return;}const bytes=new Uint8Array(Encoding.convert(Encoding.stringToCode(s),{to:'SJIS',from:'UNICODE'}));const url=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));const a=document.createElement('a');a.href=url;a.download='selected_kijunten.sim';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('locBtn').onclick=getLocation;$('selectShown').onclick=()=>{shown.forEach(o=>selected.add(o.i));drawList();};$('clearSel').onclick=()=>{selected.clear();drawList();};$('dlSima').onclick=downloadSima;
['useLocation','radius','group','type','status','max'].forEach(id=>$(id).addEventListener('change',render));$('q').addEventListener('input',render);map.on('moveend zoomend',()=>{if(!$('useLocation').checked)render();});
fetch('kijunten.geojson?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(g=>{data=g.features||[];buildControls();render();}).catch(e=>{$('statusText').innerHTML='<b>読込エラー：</b>'+esc(e.message)+'。index.htmlとkijunten.geojsonを同じフォルダに置いてください。';});
</script>
</body></html>
