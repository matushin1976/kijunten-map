<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>基準点マップ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5;}
header{background:#fff;padding:10px;border-bottom:1px solid #ccc;}
button{padding:8px;border:none;border-radius:6px;background:#007bff;color:#fff;}
#map{height:40vh;}
#list{padding:10px;}
.card{background:#fff;margin-bottom:8px;padding:10px;border-radius:8px;}
.badge{
  display:inline-block;
  padding:3px 6px;
  border-radius:6px;
  color:#fff;
  font-weight:bold;
  margin-right:6px;
}
</style>
</head>

<body>

<header>
  <button onclick="getLocation()">現在地から検索</button>
  <span>（5km / 最大50件）</span>
</header>

<div id="map"></div>
<div id="status">待機中</div>
<div id="list"></div>

<script>
const MAX_DIST = 5000;
const MAX_POINTS = 50;

let map = L.map('map').setView([32.58,131.66], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let markers = L.layerGroup().addTo(map);
let data = [];

function getColor(g){
  if(!g) return "#888";
  g = g.toString();

  if(g.includes("TR1")||g.includes("一等")||g.includes("1級")) return "#ff0000";
  if(g.includes("TR2")||g.includes("二等")||g.includes("2級")) return "#ffd700";
  if(g.includes("TR3")||g.includes("三等")||g.includes("3級")) return "#00aa00";
  if(g.includes("TR4")||g.includes("四等")||g.includes("4級")) return "#0066ff";

  return "#888";
}

function dist(a,b,c,d){
  const R=6371000;
  const toRad=Math.PI/180;
  let dLat=(c-a)*toRad;
  let dLon=(d-b)*toRad;
  let x=Math.sin(dLat/2)**2+
    Math.cos(a*toRad)*Math.cos(c*toRad)*
    Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

async function load(){
  let res = await fetch("kijunten.geojson?v="+Date.now());
  let geo = await res.json();
  data = geo.features;
}

async function getLocation(){
  document.getElementById("status").innerText="位置取得中...";

  navigator.geolocation.getCurrentPosition(pos=>{
    let lat=pos.coords.latitude;
    let lon=pos.coords.longitude;

    search(lat,lon);

  },()=>{
    alert("位置情報取れない");
  });
}

function search(myLat,myLon){

  markers.clearLayers();

  let arr=[];

  data.forEach(f=>{
    let p=f.properties;
    let lat=f.geometry.coordinates[1];
    let lon=f.geometry.coordinates[0];

    let d=dist(myLat,myLon,lat,lon);

    if(d<=MAX_DIST){
      arr.push({
        name:p["基準点名"]||p["点名"],
        grade:p["等級種別"]||p["等級"],
        status:p["現況状態"],
        lat,lon,d
      });
    }
  });

  arr.sort((a,b)=>a.d-b.d);
  arr=arr.slice(0,MAX_POINTS);

  document.getElementById("status").innerText="該当 "+arr.length+"件";

  let html="";

  arr.forEach(a=>{

    L.marker([a.lat,a.lon]).addTo(markers);

    html+=`
    <div class="card">
      <span class="badge" style="background:${getColor(a.grade)}">
        ${a.grade||"-"}
      </span>
      <div>${a.name}</div>
      <div>${a.d.toFixed(0)} m</div>
      <a href="https://maps.google.com/?q=${a.lat},${a.lon}" target="_blank">地図</a>
    </div>
    `;
  });

  document.getElementById("list").innerHTML=html;

  map.setView([myLat,myLon],13);
}

load();
</script>

</body>
</html>
