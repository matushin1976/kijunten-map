<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>基準点 5km検索 v2026-05-04-2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f6f7f8;color:#111}header{position:sticky;top:0;z-index:1000;background:#fff;padding:10px;border-bottom:1px solid #ddd}h1{font-size:18px;margin:0 0 8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:7px}button,select,input{font-size:16px;padding:9px;border:1px solid #bbb;border-radius:9px;background:#fff}button{border:0;background:#0b74de;color:#fff;font-weight:700}.small{font-size:13px;padding:7px 9px;background:#666}.status{font-size:13px;line-height:1.45;margin-top:8px;color:#333}.ok{color:#087a2f;font-weight:700}.warn{color:#b00020;font-weight:700}.sub{font-size:12px;color:#666}#map{height:42vh;min-height:280px;width:100%;background:#dfe6ee}.mapFallback{padding:14px;color:#555}.wrap{padding:10px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0001}.name{font-size:17px;font-weight:700}.dist{font-weight:700;color:#0b74de}.meta{font-size:14px;color:#444;margin-top:5px;line-height:1.55}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.links a{padding:8px 10px;border-radius:8px;background:#eee;color:#111;text-decoration:none;font-size:14px}.pill{display:inline-block;border-radius:999px;background:#eee;padding:2px 8px;margin-left:5px;font-size:12px}.leaflet-popup-content{font-size:14px}
</style>
</head>
<body>
<header>
<h1>基準点 5km検索 <span class="pill">v2026-05-04-2</span></h1>
<div class="row">
<button id="locBtn">現在地から検索</button>
<select id="radius"><option value="1">1km以内</option><option value="3">3km以内</option><option value="5" selected>5km以内</option><option value="10">10km以内</option><option value="20">20km以内</option><option value="50">50km以内</option></select>
<select id="grade"><option value="">全等級</option></select>
<label><input type="checkbox" id="normalOnly" checked> 正常のみ</label>
<button id="reloadBtn" class="small">CSV再読込</button>
</div>
<div class="row"><input id="q" placeholder="点名・コード・自治体名で検索" style="flex:1;min-width:180px"><select id="limit"><option value="50">50点表示</option><option value="100">100点表示</option><option value="200" selected>200点表示</option><option value="500">500点表示</option></select></div>
<div id="status" class="status">起動中...</div>
</header>
<div id="map"></div>
<div id="list" class="wrap"></div>
<script>
'use strict';
const CSV_FILE='kijunten.csv';
const REQUIRED=['基準点コード','等級種別','基準点名','北緯','東経','現況状態'];
let allPoints=[],userPos=null,map=null,markers=[],meMarker=null,info={rows:0,bad:0,headers:[],enc:'未判定'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setStatus(html){$('status').innerHTML=html;}
function normalizeHeader(h){return String(h??'').replace(/^\uFEFF/,'').trim();}
function dmsToDeg(value){
  let s=String(value??'').trim(); if(!s)return NaN;
  s=s.replace(/[＋+]/g,'').replace(/[－−]/g,'-').replace(/,/g,'');
  const sign=s.startsWith('-')?-1:1; s=s.replace(/^-/,'');
  const n=parseFloat(s); if(!Number.isFinite(n))return NaN;
  if(Math.abs(n)>=10000){const deg=Math.floor(n/10000);const min=Math.floor((n-deg*10000)/100);const sec=n-deg*10000-min*100;return sign*(deg+min/60+sec/3600);} 
  return sign*n;
}
function distanceKm(lat1,lon1,lat2,lon2){const R=6371;const rad=x=>x*Math.PI/180;const dlat=rad(lat2-lat1),dlon=rad(lon2-lon1);const a=Math.sin(dlat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dlon/2)**2;return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function parseDelimited(text){
  text=String(text||'').replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const first=text.split('\n')[0]||''; const delim=((first.match(/\t/g)||[]).length>(first.match(/,/g)||[]).length)?'\t':',';
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];
    if(q){if(c==='"'&&n==='"'){cell+='"';i++;}else if(c==='"'){q=false;}else{cell+=c;}}
    else{if(c==='"'){q=true;}else if(c===delim){row.push(cell);cell='';}else if(c==='\n'){row.push(cell); if(row.some(v=>String(v).trim()!=='')) rows.push(row); row=[]; cell='';}else{cell+=c;}}
  }
  row.push(cell); if(row.some(v=>String(v).trim()!=='')) rows.push(row);
  if(!rows.length)return [];
  const headers=rows.shift().map(normalizeHeader); info.headers=headers;
  return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,String(r[i]??'').trim()])));
}
function decodeArrayBuffer(buf){
  const encs=['utf-8','shift_jis','windows-31j']; let best={text:'',enc:'不明',score:-1e9};
  for(const enc of encs){try{const text=new TextDecoder(enc).decode(buf);const head=text.slice(0,600);let score=0;REQUIRED.forEach(k=>{if(head.includes(k))score+=100;}); score-=(head.match(/�/g)||[]).length*50; if(score>best.score)best={text,enc,score};}catch(e){}}
  return best;
}
function initMap(){
  const el=$('map');
  if(map)return true;
  if(!window.L){el.innerHTML='<div class="mapFallback">地図ライブラリを読み込めません。通信環境がない場合でも、下の一覧とGoogleマップリンクは使えます。</div>';return false;}
  map=L.map('map',{zoomControl:true}).setView([32.582,131.665],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  setTimeout(()=>map.invalidateSize(),250); return true;
}
async function loadCSV(){
  try{
    setStatus('CSV読み込み中...'); initMap(); allPoints=[]; info={rows:0,bad:0,headers:[],enc:'未判定'}; $('grade').innerHTML='<option value="">全等級</option>'; $('list').innerHTML='';
    const res=await fetch(CSV_FILE+'?v='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('kijunten.csv が取得できません HTTP '+res.status);
    const buf=await res.arrayBuffer(); const dec=decodeArrayBuffer(buf); info.enc=dec.enc;
    const rows=parseDelimited(dec.text); info.rows=rows.length;
    const miss=REQUIRED.filter(k=>!info.headers.includes(k));
    if(miss.length) throw new Error('CSVに必要列がありません: '+miss.join(', ')+' / 読み込んだ列: '+info.headers.join(' | '));
    let bad=0;
    allPoints=rows.map(o=>{const lat=dmsToDeg(o['北緯']),lon=dmsToDeg(o['東経']); if(!Number.isFinite(lat)||!Number.isFinite(lon))bad++; return {code:o['基準点コード'],grade:o['等級種別'],name:o['基準点名'],lat,lon,status:o['現況状態'],elev:o['標高'],pref:o['都道府県名']||'',city:o['自治体名']||'',x:o['X']||'',y:o['Y']||''};}).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon));
    info.bad=bad;
    [...new Set(allPoints.map(p=>p.grade).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja')).forEach(g=>$('grade').insertAdjacentHTML('beforeend',`<option value="${esc(g)}">${esc(g)}</option>`));
    render();
  }catch(e){setStatus('<span class="warn">読み込みエラー: '+esc(e.message)+'</span><br><span class="sub">GitHubに index.html と kijunten.csv が同じフォルダで置かれているか確認。</span>');$('list').innerHTML='<div class="card warn">CSVを読めていません。</div>';}
}
function baseFiltered(){const g=$('grade').value,normal=$('normalOnly').checked,q=$('q').value.trim().toLowerCase();return allPoints.filter(p=>(!g||p.grade===g)&&(!normal||String(p.status).trim()==='正常')&&(!q||(p.name+p.code+p.pref+p.city+p.grade).toLowerCase().includes(q)));}
function getFiltered(){let arr=baseFiltered(); if(userPos){arr=arr.map(p=>({...p,dist:distanceKm(userPos.lat,userPos.lon,p.lat,p.lon)})).sort((a,b)=>a.dist-b.dist); const r=+$('radius').value; return {all:arr,inRadius:arr.filter(p=>p.dist<=r)};} return {all:arr.map(p=>({...p,dist:null})).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ja')),inRadius:null};}
function render(){
  initMap(); const filtered=getFiltered(); const limit=+$('limit').value; let arr=userPos?filtered.inRadius:filtered.all; let notice='';
  if(userPos && arr.length===0 && filtered.all.length){arr=filtered.all.slice(0,Math.min(10,limit)); notice=`<div class="card warn">${$('radius').value}km以内には条件一致点がありません。参考として近い順${arr.length}点を表示します。</div>`;}
  const shown=arr.slice(0,limit);
  setStatus(`<span class="ok">CSV読込OK</span>：${info.rows}行 / 有効座標 ${allPoints.length}点 / 座標不明 ${info.bad}点 / 文字コード ${esc(info.enc)}<br>条件一致 ${userPos?(filtered.inRadius.length+'点（半径内） / 条件全体 '+filtered.all.length+'点'):(filtered.all.length+'点')} / 表示 ${shown.length}点 ${userPos?'/ 現在地取得済み':'/ 現在地未取得'}`);
  if(map){markers.forEach(m=>map.removeLayer(m)); markers=[]; shown.forEach(p=>{const m=L.marker([p.lat,p.lon]).addTo(map).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.grade)} / ${esc(p.status)}${p.dist!=null?'<br>'+p.dist.toFixed(2)+'km':''}<br><a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}">Googleマップ</a>`); markers.push(m);}); if(meMarker){map.removeLayer(meMarker);meMarker=null;} if(userPos){meMarker=L.circleMarker([userPos.lat,userPos.lon],{radius:8,color:'#d00'}).addTo(map).bindPopup('現在地'); if(shown.length){map.fitBounds(L.latLngBounds([[userPos.lat,userPos.lon],...shown.map(p=>[p.lat,p.lon])]).pad(0.18));}else{map.setView([userPos.lat,userPos.lon],13);}} else if(shown.length){map.fitBounds(L.latLngBounds(shown.map(p=>[p.lat,p.lon])).pad(0.2));} setTimeout(()=>map.invalidateSize(),150);}
  $('list').innerHTML=notice+(shown.map(p=>{const mapurl=`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}`;const nav=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=driving`;return `<div class="card"><div class="name">${esc(p.name)} ${p.dist!=null?`<span class="dist">${p.dist.toFixed(2)}km</span>`:''}</div><div class="meta">${esc(p.grade)} / ${esc(p.status)}<br>コード: ${esc(p.code)}<br>${esc(p.pref)} ${esc(p.city)}<br>緯度経度: ${p.lat.toFixed(7)}, ${p.lon.toFixed(7)}<br>標高: ${esc(p.elev)} / XY: ${esc(p.x)}, ${esc(p.y)}</div><div class="links"><a target="_blank" href="${mapurl}">Googleマップ</a><a target="_blank" href="${nav}">経路</a></div></div>`}).join('') || '<div class="card warn">条件に合う点がありません。等級を全等級に戻す、または「正常のみ」を外してください。</div>');
}
$('locBtn').onclick=()=>{if(!navigator.geolocation){setStatus('<span class="warn">このブラウザでは位置情報が使えません。</span>');return;} setStatus('現在地取得中...'); navigator.geolocation.getCurrentPosition(pos=>{userPos={lat:pos.coords.latitude,lon:pos.coords.longitude};render();},err=>{setStatus('<span class="warn">現在地取得失敗: '+esc(err.message)+'</span>');render();},{enableHighAccuracy:true,timeout:15000,maximumAge:10000});};
$('reloadBtn').onclick=loadCSV; ['radius','grade','normalOnly','q','limit'].forEach(id=>$(id).addEventListener('input',render)); window.addEventListener('load',loadCSV);
</script>
</body>
</html>
