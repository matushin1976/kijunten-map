let current = null;
let map = L.map('map').setView([32.58, 131.66], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
let layer = L.layerGroup().addTo(map);
let meMarker = null;
function haversine(a,b,c,d) {
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(c-a), dLon=toRad(d-b);
  const x=Math.sin(dLat/2)**2 + Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function fmtDist(m) { return m==null ? '—' : (m<1000 ? Math.round(m)+' m' : (m/1000).toFixed(2)+' km'); }
function filtered() {
  const grade=document.getElementById('grade').value;
  const st=document.getElementById('statusFilter').value;
  const q=document.getElementById('q').value.trim();
  let arr=points.filter(p=>(!grade||p.grade===grade)&&(!st||p.status===st)&&(!q||p.name.includes(q)||p.code.includes(q)));
  arr=arr.map(p=>Object.assign({}, p, {dist: current ? haversine(current.lat,current.lon,p.lat,p.lon) : null}));
  if(current) arr.sort((a,b)=>a.dist-b.dist); else arr.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  return arr;
}
function render() {
  const arr=filtered();
  layer.clearLayers();
  const bounds=[];
  arr.slice(0,200).forEach(p=>{
    const m=L.circleMarker([p.lat,p.lon], {radius:6}).bindPopup(`<b>${p.name}</b><br>${p.grade}<br>距離: ${fmtDist(p.dist)}<br>標高: ${p.h}m<br>${p.status}`);
    m.addTo(layer); bounds.push([p.lat,p.lon]);
  });
  if(current) bounds.push([current.lat,current.lon]);
  if(bounds.length) map.fitBounds(bounds, {padding:[25,25], maxZoom:15});
  document.getElementById('list').innerHTML = arr.slice(0,50).map(p=>`
    <div class="card" onclick="map.setView([${p.lat},${p.lon}],16)">
      <div class="top"><span class="name">${p.name}</span><span class="dist">${fmtDist(p.dist)}</span></div>
      <div><span class="pill">${p.grade}</span><span class="pill">${p.status}</span></div>
      <div class="meta">コード: ${p.code} / 標高: ${p.h}m<br>X: ${p.x}　Y: ${p.y}<br>
      <a target="_blank" href="https://www.google.com/maps?q=${p.lat},${p.lon}">Googleマップで開く</a></div>
    </div>`).join('');
  document.getElementById('status').textContent = `${arr.length}点表示` + (current ? '（現在地から近い順）' : '');
}
function locateMe() {
  if(!navigator.geolocation) { alert('このブラウザは現在地取得に非対応です'); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    current={lat:pos.coords.latitude, lon:pos.coords.longitude};
    if(meMarker) map.removeLayer(meMarker);
    meMarker=L.marker([current.lat,current.lon]).addTo(map).bindPopup('現在地');
    render();
  }, err=>alert('現在地が取得できません: '+err.message), {enableHighAccuracy:true, timeout:10000});
}
render();
