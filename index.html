<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基準点 近傍検索</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#f6f7f8;color:#111}
  header{position:sticky;top:0;background:#fff;padding:12px;border-bottom:1px solid #ddd;z-index:2}
  h1{font-size:18px;margin:0 0 8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button,select,input{font-size:16px;padding:9px;border:1px solid #bbb;border-radius:9px;background:#fff}button{background:#0b74de;color:#fff;border:0;font-weight:700}
  label{font-size:14px}.status{font-size:13px;margin-top:8px;color:#444}.wrap{padding:10px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0001}.name{font-size:18px;font-weight:700}.meta{font-size:14px;color:#444;margin-top:5px;line-height:1.5}.links{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.links a{padding:8px 10px;border-radius:8px;background:#eee;color:#111;text-decoration:none;font-size:14px}.dist{font-weight:700;color:#0b74de}.warn{color:#b00020;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>基準点 近傍検索</h1>
  <div class="row">
    <button id="locBtn">現在地から検索</button>
    <select id="radius"><option value="1">1km</option><option value="3">3km</option><option value="5" selected>5km</option><option value="10">10km</option><option value="20">20km</option></select>
    <select id="grade"><option value="">全等級</option></select>
    <label><input type="checkbox" id="normalOnly" checked> 正常のみ</label>
  </div>
  <div class="row" style="margin-top:8px">
    <input id="q" placeholder="点名・コード検索" style="flex:1;min-width:180px">
    <select id="limit"><option value="50">50点</option><option value="100">100点</option><option value="200" selected>200点</option><option value="500">500点</option></select>
  </div>
  <div class="status" id="status">CSV読み込み中...</div>
</header>
<div class="wrap" id="list"></div>
<script>
const CSV_FILE='kijunten.csv';
let points=[], userPos=null;
const need=['基準点コード','等級種別','基準点名','北緯','東経','現況状態'];
function normalizeHeader(s){return String(s||'').replace(/^\uFEFF/,'').trim();}
function detectDelimiter(line){const tabs=(line.match(/\t/g)||[]).length, commas=(line.match(/,/g)||[]).length;return tabs>commas?'\t':',';}
function parseCSV(text){
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
  const first=text.split('\n')[0]; const d=detectDelimiter(first); const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){const c=text[i], n=text[i+1];
    if(q){ if(c==='"'&&n==='"'){cell+='"';i++;} else if(c==='"'){q=false;} else cell+=c; }
    else{ if(c==='"')q=true; else if(c===d){row.push(cell);cell='';} else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';} else cell+=c; }
  }
  row.push(cell); rows.push(row);
  const headers=rows.shift().map(normalizeHeader);
  return rows.filter(r=>r.some(v=>String(v).trim()!=='')).map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]??'').trim()])));
}
function dmsToDeg(v){
  if(v==null) return NaN; let s=String(v).trim(); if(!s) return NaN; s=s.replace(/[＋+]/,'').replace('－','-');
  if(/[度°]/.test(s)){ const m=s.match(/(-?\d+(?:\.\d+)?)[度°]\s*(\d+(?:\.\d+)?)?[分']?\s*(\d+(?:\.\d+)?)?[秒\"]?/); if(!m)return NaN; const sign=m[1].startsWith('-')?-1:1; return sign*(Math.abs(+m[1])+(+(m[2]||0))/60+(+(m[3]||0))/3600); }
  const num=parseFloat(s); if(!isFinite(num)) return NaN;
  if(Math.abs(num)>1000){ const abs=Math.abs(num); const deg=Math.floor(abs/10000); const min=Math.floor((abs-deg*10000)/100); const sec=abs-deg*10000-min*100; return Math.sign(num)*(deg+min/60+sec/3600); }
  return num;
}
function hav(a,b,c,d){const R=6371, toRad=x=>x*Math.PI/180; const A=toRad(c-a), B=toRad(d-b); const x=Math.sin(A/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(B/2)**2; return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){
  const r=+radius.value, lim=+limit.value, g=grade.value, query=q.value.trim().toLowerCase(), normal=normalOnly.checked;
  let arr=points.filter(p=>!g||p.grade===g).filter(p=>!normal||p.status==='正常').filter(p=>!query||(p.name+p.code).toLowerCase().includes(query));
  if(userPos){ arr=arr.map(p=>({...p,dist:hav(userPos.lat,userPos.lon,p.lat,p.lon)})).filter(p=>p.dist<=r).sort((a,b)=>a.dist-b.dist); }
  else arr=arr.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  const shown=arr.slice(0,lim);
  status.textContent=`全${points.length}点 / 条件一致${arr.length}点 / 表示${shown.length}点`+(userPos?`（現在地から${r}km以内）`:'（現在地未取得）');
  list.innerHTML=shown.map(p=>{
    const map=`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}`;
    const nav=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=driving`;
    return `<div class="card"><div class="name">${esc(p.name)} <span class="dist">${p.dist!=null?p.dist.toFixed(2)+'km':''}</span></div><div class="meta">${esc(p.grade)} / ${esc(p.status)}<br>コード: ${esc(p.code)}<br>緯度経度: ${p.lat.toFixed(7)}, ${p.lon.toFixed(7)}<br>標高: ${esc(p.elev||'')}</div><div class="links"><a href="${map}" target="_blank">地図</a><a href="${nav}" target="_blank">経路</a></div></div>`;
  }).join('') || '<div class="card warn">条件に合う点がありません。</div>';
}
async function load(){
 try{
  const res=await fetch(CSV_FILE+'?v='+Date.now()); if(!res.ok) throw new Error('CSVが見つかりません');
  const buf=await res.arrayBuffer(); let text;
  try{text=new TextDecoder('shift_jis').decode(buf);}catch(e){text=new TextDecoder('utf-8').decode(buf);}
  const rows=parseCSV(text); const headers=Object.keys(rows[0]||{}); const miss=need.filter(n=>!headers.includes(n));
  if(miss.length) throw new Error('CSVに必要列がありません: '+miss.join(', ')+' / 読み取った列: '+headers.join(', '));
  points=rows.map(o=>({code:o['基準点コード'],grade:o['等級種別'],name:o['基準点名'],lat:dmsToDeg(o['北緯']),lon:dmsToDeg(o['東経']),status:o['現況状態'],elev:o['標高'],raw:o})).filter(p=>isFinite(p.lat)&&isFinite(p.lon));
  [...new Set(points.map(p=>p.grade).filter(Boolean))].sort().forEach(x=>grade.insertAdjacentHTML('beforeend',`<option value="${esc(x)}">${esc(x)}</option>`));
  render();
 }catch(e){status.innerHTML='<span class="warn">読み込みエラー: '+esc(e.message)+'</span>';}
}
locBtn.onclick=()=>{ if(!navigator.geolocation){status.innerHTML='<span class="warn">位置情報が使えません</span>';return;} status.textContent='現在地取得中...'; navigator.geolocation.getCurrentPosition(pos=>{userPos={lat:pos.coords.latitude,lon:pos.coords.longitude};render();},err=>{status.innerHTML='<span class="warn">現在地取得失敗: '+esc(err.message)+'</span>';},{enableHighAccuracy:true,timeout:15000,maximumAge:10000});};
[radius,grade,normalOnly,q,limit].forEach(el=>el.addEventListener('input',render));
load();
</script>
</body>
</html>
